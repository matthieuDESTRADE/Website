<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js"></script>
<script>
    const pdfURL =
        "https://matthieudestrade.github.io/Website/assets/EN_resume_DESTRADE.pdf";
    const container = document.getElementById("pdfContainer");
    

    let pdfDoc = null;
    let canvasMap = new Map();
    let resizeTimeout;
    let lastRenderedWidth = 0; 
    
    const FIXED_HIGH_SCALE = 2.0; 

    async function renderPage(page, canvas, pageIndex, targetWidth) {
        // 1. Get native page dimensions for aspect ratio
        const initialViewport = page.getViewport({ scale: 1 });

        const viewport = page.getViewport({ scale: FIXED_HIGH_SCALE });
        const ctx = canvas.getContext("2d");

        // 4. Set the internal canvas resolution (high-resolution pixels)
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        // 5. Set the CSS size for layout (what the user sees)
        canvas.style.width = targetWidth + "px"; 
        // Maintain aspect ratio relative to the CSS width
        canvas.style.height = `${targetWidth / initialViewport.width * initialViewport.height}px`;
        
        // 6. Manage and run the render task
        const pageInfo = canvasMap.get(canvas);
        if (pageInfo && pageInfo.renderTask && pageInfo.renderTask._internalRenderTask) {
             pageInfo.renderTask._internalRenderTask.cancel(); // Cancel previous task
        }

        const renderContext = {
            canvasContext: ctx,
            viewport
        };
        
        const renderTask = page.render(renderContext);
        canvasMap.set(canvas, { page, pageNum: pageIndex, renderTask }); 
    }

    function reRenderAllPages(targetWidth) {
        // Use container.clientWidth as a fallback for the resize event where targetWidth might not be explicitly passed
        const finalTargetWidth = targetWidth || container.clientWidth; 

        if (!pdfDoc || canvasMap.size === 0 || finalTargetWidth === lastRenderedWidth) return;

        console.log(`Re-rendering pages at width: ${finalTargetWidth}`);
        
        canvasMap.forEach((pageInfo, canvas) => {
             renderPage(pageInfo.page, canvas, pageInfo.pageNum, finalTargetWidth);
        });
        
        lastRenderedWidth = finalTargetWidth;
    }

    pdfjsLib.getDocument(pdfURL).promise.then(pdf => {
        pdfDoc = pdf;
        
        container.innerHTML = ''; 
        canvasMap.clear();

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            pdf.getPage(pageNum).then(page => {
                const canvas = document.createElement("canvas");
                canvas.className = "pdf-page-canvas";
                canvas.style.borderRadius = '10px';
                canvas.setAttribute('role', 'img');
                canvas.setAttribute('aria-label', `PDF page ${pageNum}`);
                container.appendChild(canvas);
                canvasMap.set(canvas, { page, pageNum }); 

                if (pageNum === pdf.numPages) {
                    // Initial render using the container's current width
                    reRenderAllPages(container.clientWidth);
                }
            });
        }
        
        // *** FUNCTIONAL PRINT BUTTON ***
        const openBtn = document.getElementById("openBtn");
        if (openBtn) {
            openBtn.addEventListener("click", () => {
                window.open(pdfURL, "_blank");
            });
        }

        // *** FUNCTIONAL DOWNLOAD BUTTON ***
        const downloadBtn = document.getElementById("downloadBtn");
        if (downloadBtn) {
            downloadBtn.href = "https://raw.githubusercontent.com/matthieuDESTRADE/Website/c8b1e993c1a90bc6d4edaa41d78fe4ad218a8dc1/assets/EN_resume_DESTRADE.pdf";
            
        }
    });

    // --- Adapt to Resize (Desktop/Orientation Change) ---
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            // Re-render using the new client width
            reRenderAllPages(container.clientWidth); 
        }, 100);
    });
</script>
<script>
    (function(){
      const navToggle = document.getElementById('nav-toggle');
      const primaryNav = document.querySelector('.primary-nav');

      if(!navToggle || !primaryNav) return;

      function closeNav(){
        primaryNav.classList.remove('active');
        navToggle.setAttribute('aria-expanded','false');
      }

      navToggle.addEventListener('click', function(e){
        e.stopPropagation();
        const isOpen = primaryNav.classList.toggle('active');
        navToggle.setAttribute('aria-expanded', String(!!isOpen));
        navToggle.classList.toggle('open', !!isOpen);
      });

      // prevent clicks inside the nav from closing it
      primaryNav.addEventListener('click', function(e){ e.stopPropagation(); });

      // close when clicking outside on small screens
      document.addEventListener('click', function(e){
        if(!primaryNav.classList.contains('active')) return;
        if(e.target === navToggle || primaryNav.contains(e.target)) return;
        closeNav();
        navToggle.classList.remove('open');
      });
    })();
  </script>
