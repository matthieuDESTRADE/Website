<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js"></script>
<script>
    const pdfURL =
        "https://matthieudestrade.github.io/Website/assets/EN_resume_DESTRADE.pdf";

    const container = document.getElementById("pdfContainer");
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

    let pdfDoc = null; // Store the loaded PDF document
    let canvasMap = new Map(); // Store canvases and pages

    /**
     * Renders a specific page to a canvas with a given scale.
     * @param {PDFPageProxy} page - The PDF page object.
     * @param {HTMLCanvasElement} canvas - The target canvas element.
     * @param {number} scale - The desired scale factor.
     */
    function renderPage(page, canvas, scale) {
        const viewport = page.getViewport({ scale });
        const ctx = canvas.getContext("2d");

        // Set the internal canvas resolution (high resolution for crispness)
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        // Set the CSS size for layout (fixed width for responsiveness)
        // We ensure the width is 100% of the parent container for initial layout
        canvas.style.width = "100%";
        // Calculate the height proportionally to maintain aspect ratio
        canvas.style.height = `${viewport.height / scale / (viewport.width / scale) * (container.clientWidth)}px`;
        
        // Render the page
        page.render({
            canvasContext: ctx,
            viewport
        });
    }

    /**
     * Re-renders all pages based on the current container width.
     */
    function reRenderAllPages() {
        if (!pdfDoc) return;

        // Determine the target width for the PDF view (e.g., 100% of the container)
        const targetWidth = container.clientWidth;
        
        // Use the first page's view to calculate the necessary scale
        // This assumes all pages have the same initial size/aspect ratio
        const firstPageInfo = canvasMap.keys().next().value; 
        if (!firstPageInfo) return; // No pages loaded yet

        const page = firstPageInfo.page;
        const initialViewport = page.getViewport({ scale: 0.2 });
        // Calculate the new scale to make the PDF fit the targetWidth
        const newScale = targetWidth / initialViewport.width; 

        // Re-render each page with the new scale
        canvasMap.forEach((canvas, { page, pageNum }) => {
            // Re-render the page
            renderPage(page, canvas, newScale);
        });
    }

    /**
     * Initial loading and setup of the PDF.
     */
    pdfjsLib.getDocument(pdfURL).promise.then(pdf => {
        pdfDoc = pdf; // Store the document reference
        
        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            pdf.getPage(pageNum).then(page => {
                const canvas = document.createElement("canvas");
                canvas.className = "pdf-page-canvas"; // Optional CSS class for styling
                container.appendChild(canvas);

                // Store the page and canvas
                canvasMap.set({ page, pageNum }, canvas); 

                // Initial render will happen when reRenderAllPages is called
                // The delay ensures the DOM has settled and clientWidth is correct
                if (pageNum === pdf.numPages) {
                     reRenderAllPages();
                }
            });
        }
    });

    // --- Adapt to Zoom/Resize ---
    // The key to fixing the blurriness on zoom/resize is to re-render the PDF with a new scale.

    // Debounce function to limit re-renders
    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(reRenderAllPages, 100); // Wait 100ms before re-rendering
    });

    // Buttons
    document.getElementById("printBtn").addEventListener("click", () => {
        window.open(pdfURL, "_blank").print();
    });

    document.getElementById("downloadBtn").href = pdfURL;
</script>
